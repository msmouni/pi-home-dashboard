<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Sensor Dashboard</title>

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Charts -->
    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js"
    ></script>

    <script src="/static/sensors.js"></script>
    <script src="/static/weather.js"></script>
    <script src="/static/zigbee.js"></script>
    <script src="/static/app.js"></script>
  </head>

  <body class="bg-gray-900 text-gray-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-6">
      <!-- Header -->
      <div class="flex justify-between items-center">
        <h1 class="text-4xl font-extrabold text-cyan-400">
          🌡️ Sensor Dashboard
        </h1>

        <!-- Disconnect button -->
        <form action="/logout" method="get">
          <button
            type="submit"
            class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow transition"
          >
            Disconnect
          </button>
        </form>
      </div>

      <!-- External Weather -->
      <div
        id="external-weather"
        class="bg-blue-700 text-white text-center rounded-lg p-4 shadow-md"
      >
        Loading external weather...
      </div>

      <!-- Zigbee Devices -->
      <div class="bg-gray-800 rounded-lg shadow-lg p-4">
        <div class="flex justify-between items-center mb-4">
          <h4 class="text-xl font-semibold text-cyan-300">Zigbee Devices</h4>

          <div class="flex gap-2">
            <!-- Refresh devices -->
            <button
              onclick="refreshDevices()"
              class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg transition"
            >
              Refresh Devices
            </button>

            <!-- Permit join -->
            <button
              onclick="permitJoin()"
              class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg transition"
            >
              Permit Join
            </button>
          </div>
        </div>

        <!-- Status -->
        <div id="zigbee-status" class="text-sm text-gray-300 mb-4"></div>

        <!-- Devices -->
        <div
          id="zigbee-devices"
          class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"
        >
          Loading devices...
        </div>
      </div>

      <!-- Charts -->
      <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-gray-800 rounded-lg shadow-lg p-4">
          <h4 class="text-xl font-semibold mb-2 text-cyan-300">Temperature</h4>
          <div id="temp_chart" class="w-full h-80"></div>
        </div>

        <div class="bg-gray-800 rounded-lg shadow-lg p-4">
          <h4 class="text-xl font-semibold mb-2 text-cyan-300">Pressure</h4>
          <div id="pressure_chart" class="w-full h-80"></div>
        </div>

        <div class="bg-gray-800 rounded-lg shadow-lg p-4 md:col-span-2">
          <h4 class="text-xl font-semibold mb-2 text-cyan-300">Humidity</h4>
          <div id="humidity_chart" class="w-full h-80"></div>
        </div>
      </div>
    </div>
  </body>
</html>
